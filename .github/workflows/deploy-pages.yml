name: Deploy Sentinela Infantil to GitHub Pages

on:
  # Executa automaticamente a cada push na branch main
  push:
    branches: ["main"]
  # Permite disparar manualmente na aba Actions do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy em andamento por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos estáticos do PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
